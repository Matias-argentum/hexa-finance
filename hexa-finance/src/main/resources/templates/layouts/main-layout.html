<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lita</title>
    <!-- custom styling -->
    <link rel="stylesheet" href="/css/custom.css">
    <!-- Pico CSS for styling -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.cyan.min.css"
    >
    <!-- Tabler icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.35.0/tabler-icons.min.css"
          integrity="sha512-gzw5zNP2TRq+DKyAqZfDclaTG4dOrGJrwob2Fc8xwcJPDPVij0HowLIMZ8c1NefFM0OZZYUUUNoPfcoI5jqudw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <!-- HTMX library -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"
            integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz"
            crossorigin="anonymous"></script>
</head>
<body>
<nav class="container">
    <ul>
        <li>
            <a href="/">
                <img src="/images/Lita2.png" class="main-logo" alt="LITA Logo">
            </a>
        </li>
    </ul>
    <ul>
        <li sec:authorize="isAuthenticated()">
            <span class="secondary">Hola, <span sec:authentication="name">Usuario</span></span>
        </li>
        <li sec:authorize="isAuthenticated()">
            <a href="/transactions" class="secondary">Transacciones</a>
        </li>
        <li sec:authorize="isAuthenticated()">
            <a href="/categories" class="secondary">Categorías</a>
        </li>
        <li sec:authorize="isAuthenticated()">
            <button class="outline contrast"
                    hx-post="/logout"
                    hx-target="body">
                Logout
            </button>
        </li>

        <li sec:authorize="isAnonymous()">
            <a href="/login" class="contrast">Login</a>
        </li>
        <li sec:authorize="isAnonymous()">
            <a href="/register" class="outline">Registro</a>
        </li>
    </ul>
</nav>
<main class="container-content">
    <div th:replace="~{__${content}__}"></div>
</main>
<div id="toast-container"></div>
<div id="modal-container"></div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);

        let message = '';
        if (params.get('regSuccess') === 'true') message = "¡Registro exitoso! Ya puedes entrar.";
        if (params.get('success') === 'true') message = "Bienvenido";
        if (params.get('error') === 'true') message = "Credenciales incorrectas.";
        if (params.has('logout')) message = "¡Hasta luego!"

        if (message) {
            document.body.dispatchEvent(new CustomEvent('notify', {
                detail: { message }
            }));
        }
    });
</script>
<script>
    document.body.addEventListener('notify', (event) => {
        const container = document.getElementById('toast-container');

        // crear el elemento del toast
        const toast = document.createElement('article');
        toast.className = 'toast-card';
        // estructura de Pico CSS: un párrafo y un botón de cierre
        toast.innerHTML = `
            <div class="toast-content">
                <span>${event.detail.message}</span>
                <button aria-label="Close" class="outline contrast" onclick="this.closest('article').remove()">X</button>
            </div>
        `;

        container.appendChild(toast);

        // Auto-eliminar después de 3 segundos con una pequeña transición
        setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 600);
        }, 4000);
    });

    document.body.addEventListener('closeModal', function() {
        const modal = document.querySelector('dialog[open]');
        if (modal) {
            modal.remove(); // Solo actúa si hay algo abierto
        }
    });
</script>
</body>
</html>
