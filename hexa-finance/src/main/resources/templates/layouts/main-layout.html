<!DOCTYPE html>
<html lang="es"
      data-theme="dark"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lita</title>
    <link rel="stylesheet" th:href="@{/css/custom.css}">

    <link rel="stylesheet" th:href="@{/css/vendor/pico.cyan.min.css}">

    <link rel="stylesheet" th:href="@{/css/vendor/tabler-icons.min.css}">
    <!-- HTMX library -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"
            integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz"
            crossorigin="anonymous"></script>
</head>
<body>
<nav class="container">
    <ul>
        <li>
            <a href="/">
                <img src="/images/Lita2.png" class="main-logo" alt="LITA Logo">
            </a>
        </li>
    </ul>
    <ul>
        <li sec:authorize="isAuthenticated()">
            <details class="dropdown">
                <summary aria-haspopup="listbox" role="link" class="outline contrast">
                    <i class="ti ti-menu-2"></i>
                </summary>
                <ul role="listbox">
                    <li><a href="/transactions">Transacciones</a></li>
                    <li><a href="/recurring">Transacciones Automatizadas</a></li>
                    <li><a href="/categories">Categorías</a></li>
                    <li><a href="/reports">Reportes</a></li>
                    <li><a href="/profile">Mi Perfil</a></li>
                    <li sec:authorize="hasRole('ADMIN')">
                        <div >
                            <a href="/admin">Panel de Administración</a>
                        </div>
                    </li>
                    <li>
                        <form hx-post="/logout" hx-target="body">
                            <button type="submit" class="outline contrast" style="width: 100%">Logout</button>
                        </form>
                    </li>
                </ul>
            </details>
        </li>
    </ul>
</nav>
<main class="container-content">
    <div th:replace="~{__${content}__}"></div>
</main>
<div id="toast-container"></div>
<div id="modal-container"></div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const sessionMessage = sessionStorage.getItem('toastMessage');
        if (sessionMessage) {
            sessionStorage.removeItem('toastMessage'); // Lo borramos para que no repita al refrescar
            document.body.dispatchEvent(new CustomEvent('notify', {
                detail: { message: sessionMessage }
            }));
            return;
        }
        const params = new URLSearchParams(window.location.search);

        let message = '';
        if (params.get('regSuccess') === 'true') message = "¡Registro exitoso! Ya puedes entrar.";
        if (params.get('success') === 'true') message = "Bienvenido";
        if (params.get('error') === 'true') message = "Credenciales incorrectas.";
        if (params.has('logout')) message = "¡Hasta luego!"
        if (params.get('dataChanged') === 'true') message = "Tus datos han cambiado. Por seguridad, vuelve a ingresar.";

        if (message) {
            document.body.dispatchEvent(new CustomEvent('notify', {
                detail: { message }
            }));
        }
    });
</script>
<script>
    document.body.addEventListener('preSaveToast', (event) => {
    // Guardamos el texto que mandó el controlador
    sessionStorage.setItem('toastMessage', event.detail.value);
});
</script>
<script>
    document.body.addEventListener('notify', (event) => {
        const container = document.getElementById('toast-container');

        // crear el elemento del toast
        const toast = document.createElement('article');
        toast.className = 'toast-card';
        // estructura de Pico CSS: un párrafo y un botón de cierre
        toast.innerHTML = `
            <div class="toast-content">
                <span>${event.detail.message}</span>
                <button aria-label="Close" class="outline contrast" onclick="this.closest('article').remove()">X</button>
            </div>
        `;

        container.appendChild(toast);

        // Auto-eliminar después de 3 segundos con una pequeña transición
        setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 600);
        }, 4000);
    });

    document.body.addEventListener('closeModal', function() {
        const modal = document.querySelector('dialog[open]');
        if (modal) {
            modal.remove(); // Solo actúa si hay algo abierto
        }
    });
</script>
</body>
</html>
