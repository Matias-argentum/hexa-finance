<article th:id="'category-card-' + ${category.id}"  class="cat-card" th:fragment="category-item">
    <div class="cat-description">
        <i th:class="'ti ti-' + ${category.iconName}"></i>
        <strong th:text="${category.name}"></strong>
    </div>

    <footer class="cat-card-footer" th:fragment="category-item">
        <th:block th:if="${#authorization.expression('hasRole(''ROLE_ADMIN'')') or category.userId != null}">
            <button class="secondary cat-button"
                    th:hx-get="@{/categories/{id}/edit(id=${category.id})}"
                    hx-target="closest .cat-card"
                    hx-swap="outerHTML"
                    hx-indicator="body">
                <i class="ti ti-edit"></i>
            </button>

            <button class="secondary cat-button"
                    th:hx-get="@{/categories/{id}/delete-confirm(id=${category.id})}"
                    hx-target="#modal-container"
                    hx-indicator="body">
                <i class="ti ti-trash cat-icon-delete"></i>
            </button>
        </th:block>

    </footer>
</article>

<article class="cat-card" th:fragment="category-edit-form">
    <form th:hx-put="@{/categories/{id}(id=${category.id})}"
          hx-target="closest .cat-card"
          hx-swap="outerHTML">

        <div class="cat-description">
            <input type="hidden" name="id" th:value="${category.id}">

            <input type="text" name="name" th:value="${category.name}" placeholder="Nombre" required>

            <th:block th:if="${#authorization.expression('hasRole(''ROLE_ADMIN'')')}">
                <label>Icono (Tabler ID):</label>
                <input type="text" name="iconName" th:value="${category.iconName}" required>
            </th:block>

            <th:block th:unless="${#authorization.expression('hasRole(''ROLE_ADMIN'')')}">
                <i th:class="'ti ti-' + ${category.iconName}"></i> <input type="hidden" name="iconName" th:value="${category.iconName}">
            </th:block>
        </div>

        <footer style="justify-content: center;">
            <button type="button" class="outline secondary cat-button"
                    hx-disabled-elt="this"
                    th:hx-get="@{/categories/{id}(id=${category.id})}"
                    hx-target="closest .cat-card"
                    hx-swap="outerHTML">
                <i class="ti ti-x"></i>
            </button>
            <button type="submit" class="cat-button" hx-disabled-elt="this">
                <i class="ti ti-check"></i>
            </button>
        </footer>
    </form>
</article>


<dialog id="category-modal" th:fragment="category-modal" open>
    <article>
        <header>
            <button aria-label="Close" rel="prev"
                    onclick="document.getElementById('category-modal').remove()"></button>
            <h3>Crear Categoría</h3>
        </header>

        <form hx-post="/categories"
              hx-target="#modal-container"
              hx-swap="innerHTML">
            <label for="name">Nombre</label>
            <input type="text" id="name" name="name" placeholder="Ej: Comida" required>

            <fieldset>
                <legend>Icono de la Categoría</legend>

                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-top: 0.5rem; font-size: 0.9rem;">

                    <label style="margin-bottom: 0; cursor: pointer; display: flex; align-items: center; gap: 0.25rem;">
                        <input type="radio" name="iconName" value="utensils" required>
                        <i class="ti ti-tools-kitchen-2"></i> Comida
                    </label>

                    <label style="margin-bottom: 0; cursor: pointer; display: flex; align-items: center; gap: 0.25rem;">
                        <input type="radio" name="iconName" value="home">
                        <i class="ti ti-home"></i> Hogar
                    </label>

                    <label style="margin-bottom: 0; cursor: pointer; display: flex; align-items: center; gap: 0.25rem;">
                        <input type="radio" name="iconName" value="car">
                        <i class="ti ti-car"></i> Transp.
                    </label>

                    <label style="margin-bottom: 0; cursor: pointer; display: flex; align-items: center; gap: 0.25rem;">
                        <input type="radio" name="iconName" value="heart-medical">
                        <i class="ti ti-report-medical"></i> Salud
                    </label>

                    <label style="margin-bottom: 0; cursor: pointer; display: flex; align-items: center; gap: 0.25rem;">
                        <input type="radio" name="iconName" value="device-gamepad-2">
                        <i class="ti ti-ball-football"></i> Ocio
                    </label>

                    <label style="margin-bottom: 0; cursor: pointer; display: flex; align-items: center; gap: 0.25rem;">
                        <input type="radio" name="iconName" value="book">
                        <i class="ti ti-book"></i> Estudios
                    </label>

                    <label style="margin-bottom: 0; cursor: pointer; display: flex; align-items: center; gap: 0.25rem;">
                        <input type="radio" name="iconName" value="shirt">
                        <i class="ti ti-shirt"></i> Ropa
                    </label>

                    <label style="margin-bottom: 0; cursor: pointer; display: flex; align-items: center; gap: 0.25rem;">
                        <input type="radio" name="iconName" value="bolt">
                        <i class="ti ti-bolt"></i> Servicios
                    </label>

                    <label style="margin-bottom: 0; cursor: pointer; display: flex; align-items: center; gap: 0.25rem;">
                        <input type="radio" name="iconName" value="gift">
                        <i class="ti ti-gift"></i> Regalos
                    </label>

                    <label style="margin-bottom: 0; cursor: pointer; display: flex; align-items: center; gap: 0.25rem;">
                        <input type="radio" name="iconName" value="paw">
                        <i class="ti ti-paw"></i> Mascotas
                    </label>

                    <label style="margin-bottom: 0; cursor: pointer; display: flex; align-items: center; gap: 0.25rem;">
                        <input type="radio" name="iconName" value="briefcase">
                        <i class="ti ti-briefcase"></i> Trabajo
                    </label>

                    <label style="margin-bottom: 0; cursor: pointer; display: flex; align-items: center; gap: 0.25rem;">
                        <input type="radio" name="iconName" value="trending-up">
                        <i class="ti ti-trending-up"></i> Inversión
                    </label>

                    <label style="margin-bottom: 0; cursor: pointer; display: flex; align-items: center; gap: 0.25rem;">
                        <input type="radio" name="iconName" value="receipt">
                        <i class="ti ti-receipt"></i> Gastos
                    </label>

                    <label style="margin-bottom: 0; cursor: pointer; display: flex; align-items: center; gap: 0.25rem;">
                        <input type="radio" name="iconName" value="cash">
                        <i class="ti ti-cash"></i> Efectivo
                    </label>

                    <label style="margin-bottom: 0; pointer-events: auto; display: flex; align-items: center; gap: 0.25rem;">
                        <input type="radio" name="iconName" value="pig-money">
                        <i class="ti ti-shopping-cart"></i> Supermercado
                    </label>

                </div>
            </fieldset>
            <footer style="display:flex; gap:1rem; justify-content:flex-end;">
                <button type="button" class="secondary"
                        onclick="document.getElementById('category-modal').remove()">Cancelar</button>
                <button type="submit" hx-disabled-elt="this">Guardar</button>
            </footer>
        </form>
    </article>
</dialog>


<dialog id="category-alert-modal" th:fragment="category-alert-modal" open>
    <article>
        <header>
            <button aria-label="Close" rel="prev"
                    onclick="this.closest('dialog').remove()"></button>
            <h3>Eliminar Categoría</h3>
        </header>

        <div>
            <h4>¿Seguro que quiere borrar <strong th:text="${category.name}"></strong>?</h4>
            <p>Si borra esta categoria se borrarán todas las transacciones asociadas a ella.</p>
            <p></p>
            <footer style="display:flex; gap:1rem; justify-content:flex-end;">
                <div>
                    <button type="button" class="secondary"
                            onclick="this.closest('dialog').remove()">Cancelar</button>
                    <button type="button"
                            class="primary"
                            th:hx-delete="@{/categories/{id}(id=${category.id})}"
                            th:hx-target="'#category-card-' + ${category.id}"
                            hx-swap="delete"
                            hx-disabled-elt="this">Eliminar Con Cuidado</button>
                </div>
            </footer>
        </div>
    </article>
</dialog>
