<!-- quitar estilos y ponerlos en el css -->
<section class="container" style="max-width: 400px; margin-top: 2rem;">
    <article>
        <header>
            <strong>Iniciar Sesión</strong>
        </header>

        <form th:action="@{/login}" method="post">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="admin@admin.com" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>

            <button type="submit" class="contrast">Entrar</button>
        </form>

        <footer>
            <small>¿No tienes cuenta? <a href="/register">Regístrate aquí</a></small>
        </footer>
    </article>
</section>
