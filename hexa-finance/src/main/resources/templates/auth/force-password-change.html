<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Cambio de Contraseña Obligatorio</title>
    <link rel="stylesheet" th:href="@{/css/vendor/pico.cyan.min.css}">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="container" style="height: 100vh; display: flex; align-items: center; justify-content: center;">

<article style="width: 100%; max-width: 450px; padding: 2rem;">
    <header style="text-align: center;">
        <h2>Acceso Seguro</h2>
        <p>Por razones de seguridad, debes actualizar la contraseña asignada por el administrador antes de continuar.</p>
    </header>

    <form th:fragment="form"
          hx-post="/auth/force-change-password"
          hx-target="this"
          hx-swap="outerHTML">

        <p th:if="${error}" style="color: #ff5757; text-align: center;" th:text="${error}"></p>

        <label for="currentPassword">Contraseña temporal provista por el Admin</label>
        <input type="password" id="currentPassword" name="currentPassword" required placeholder="Ingresá la clave temporal">

        <label for="newPassword">Nueva contraseña definitiva</label>
        <input type="password" id="newPassword" name="newPassword" required placeholder="Ingresá tu nueva clave">

        <label for="confirmPassword">Confirmar nueva contraseña</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Repetí tu nueva clave">

        <footer style="display:flex; justify-content:flex-end; margin-top: 1.5rem;">
            <button type="submit" hx-disabled-elt="this">Actualizar y Entrar</button>
        </footer>
    </form>
</article>

</body>
</html>
