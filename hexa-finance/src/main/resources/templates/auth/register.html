<section class="container" style="max-width: 400px; margin-top: 2rem;">
    <article>
        <header>
            <strong>Crear Cuenta</strong>
        </header>

        <form hx-post="/register" hx-target="this" hx-swap="none">
            <label for="username">Nombre de Usuario</label>
            <input type="text" id="username" name="username" placeholder="Tu nombre" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="tu@email.com" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>

            <button type="submit" class="contrast">Registrarme</button>
        </form>

        <footer>
            <small>¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></small>
        </footer>
    </article>
</section>
