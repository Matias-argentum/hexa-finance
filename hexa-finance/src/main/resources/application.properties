spring.application.name=hexa-finance
# Database connection settings
spring.datasource.url=jdbc:mysql://localhost:3306/finance_db
spring.datasource.username=user_dev
spring.datasource.password=pass_dev
# The modern driver class name for MySQL Connector/J 8.x
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate settings
# 'update' automatically updates the database schema (useful for development)
spring.jpa.hibernate.ddl-auto=update
# Shows the SQL queries in the console
spring.jpa.show-sql=true
# Specifies the SQL dialect for Hibernate to optimize queries
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false